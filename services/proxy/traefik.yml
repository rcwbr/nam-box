entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls: {}
      sanitizePath: false

log:
  level: DEBUG
  format: json

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/tls.yml
