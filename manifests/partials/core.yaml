x-common: &common
  platform: ${PLATFORM}

services:
  core:
    <<: *common
    image: ghcr.io/rcwbr/nam-box/core:local
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - "/dev/snd:/dev/snd"
      - nam-state:/var/nam
    cap_add:
      - SYS_NICE
      - SYS_RAWIO
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    privileged: true
    environment:
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/dev/shm/dbus-session
    shm_size: 700M
    ulimits:
      memlock: -1

volumes:
  nam-state:
