x-common: &common
  platform: ${PLATFORM}

services:
  web:
    <<: *common
    # image: web-builder
    image: node:24-alpine
    entrypoint: [npm, run, dev, '--']
    labels:
      - "traefik.enable=true"
      # Catch-all router - lowest priority so it doesn't catch /api/effects or /api/bluetooth-manager
      - "traefik.http.middlewares.web-strip.stripprefix.prefixes=/"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.middlewares=web-strip"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.priority=10"
      - "traefik.http.routers.web.service=web@docker"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - proxy
    working_dir: /app
    volumes:
      - ${DEVCONTAINER_HOST_WORKSPACE_MOUNT}/services/web/preact:/app
